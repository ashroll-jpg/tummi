<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tummi">
<title>Tummi</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column on cream, chunky rounded cards, food-colored accents, floating tab bar with a center "rank" button. */
:root{
  --cream:#FBF5EA;
  --cream-2:#F3EADB;
  --card:#FFFDF9;
  --ink:#231811;
  --ink-2:#76675A;
  --line:#E9DDCB;
  --burger:#DD5A3E; --burger-ink:#B4412A;
  --pizza:#E6A23C;  --pizza-ink:#8F6114;
  --tacos:#2F9A78;  --tacos-ink:#1F7559;
  --wings:#C9527A;  --wings-ink:#A13A5E;
  --steak:#8A4536;
  --grape:#6656D8;
  --liked:#2F9A6C; --fine:#E6A23C; --disliked:#D9573D;
  --f-display:'Outfit', 'Figtree', system-ui, sans-serif;
  --f-body:'Figtree', system-ui, -apple-system, sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(35,24,17,.05), 0 6px 18px -10px rgba(35,24,17,.16);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--grape);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 110px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}
.wordmark{font-family:var(--f-display);font-weight:600;font-size:32px;letter-spacing:-.04em;line-height:1;display:flex;align-items:baseline;color:var(--ink)}
.wordmark i{font-style:normal;color:var(--burger)}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600}
.me svg{width:14px;height:14px;opacity:.6}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--pc);color:#fff;font-family:var(--f-display);font-weight:600;flex:none;line-height:1;letter-spacing:0}

.banner{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--cream);border-radius:var(--r-md);padding:10px 12px;margin-bottom:14px;font-size:14px}
.banner p{margin:0;flex:1;line-height:1.3}
.banner button{background:var(--cream);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}

/* category tabs */
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:15px}
.cat .e{color:var(--cc)}
.cat .e{width:18px;height:18px;display:grid}
.ico{width:100%;height:100%;display:block}
.cat .n{font-size:12px;background:var(--cream-2);border-radius:999px;padding:1px 7px;min-width:22px;text-align:center;font-weight:700}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.cat.on .e{color:var(--cc)}
.cat.on .n{background:rgba(255,255,255,.14)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--cream-2);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{padding:9px 6px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 10px}
.list-head h2{font-size:24px;font-weight:500}
.list-head .sub{color:var(--ink-2);font-size:14px}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.select{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:0 6px 0 12px;font-weight:700;font-size:14px;position:relative}
.select.on{border-color:var(--ink)}
.select select{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:8px 24px 8px 0;font-size:15px;font-weight:600;max-width:200px}
.select > svg{width:14px;height:14px;position:absolute;right:10px;pointer-events:none;opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:999px;background:var(--cream-2);font-size:13px;font-weight:700;color:var(--ink-2);border:2px solid transparent}
.chip.on{background:var(--ink);color:var(--cream)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--cream-2);border-radius:var(--r-md);padding:10px 12px;font-size:13.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.35}
.note b{color:var(--ink)}
.note .dot{width:10px;height:10px;border-radius:50%;background:var(--pizza);flex:none;margin-top:4px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.linkish{text-decoration:underline;font-weight:700;color:var(--ink)}

/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:30px 52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:var(--r-md);padding:8px 10px 8px 6px;box-shadow:var(--shadow);border-left:4px solid var(--bc);transition:transform .15s}
.row:active{transform:scale(.98)}
.row.flash{animation:flash 1.4s ease-out}
.row.area{grid-template-columns:30px 1fr auto}
@keyframes flash{0%{background:#FFF0B8;transform:scale(1.03)}100%{background:var(--card)}}
.rank{font-family:var(--f-display);font-size:17px;font-weight:500;text-align:center;color:var(--ink-2)}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:color-mix(in srgb, var(--cc) 14%, var(--card));color:var(--cc)}
.thumb .ico{width:46%;height:46%}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{min-width:0}
.name{font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.sub{color:var(--ink-2);font-size:13px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--cream-2);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.tag .ico{width:12px;height:12px;color:var(--cc)}
.right{display:flex;flex-direction:column;align-items:center;gap:4px}
.score{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:var(--bt);font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.score.big{width:84px;height:84px;font-size:32px}
.score.sm{width:38px;height:38px;font-size:14px}
.tier{display:inline-grid;place-items:center;min-width:22px;height:18px;padding:0 5px;border-radius:5px;font-family:var(--f-display);font-weight:600;font-size:12px;color:#fff;line-height:1;letter-spacing:.02em}
.t-S{background:var(--ink);color:#F0C35A}
.t-A{background:var(--liked)}
.t-B{background:var(--tacos-ink)}
.t-C{background:var(--pizza);color:var(--ink)}
.t-D{background:var(--burger)}

.empty{text-align:center;padding:32px 16px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, var(--cc,var(--burger)) 14%, var(--card));color:var(--cc,var(--burger))}
.empty .big .ico{width:30px;height:30px}
.empty p{margin:0;color:var(--ink-2);max-width:34ch;line-height:1.4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 20px;font-weight:600;font-size:16px;background:var(--card);border:1.5px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.btn.accent{background:var(--cc,var(--burger));color:var(--ct,#fff);border-color:transparent}
.btn.danger{color:var(--burger-ink);border-color:#F6C2B3}
.btn.danger.armed{background:var(--burger);color:#fff;border-color:var(--burger)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:14px}
.btn:disabled{opacity:.4}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:min(488px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;background:rgba(255,253,249,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 10px 30px -14px rgba(35,24,17,.35);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:#A8988A;font-size:11px;font-weight:700;border-radius:18px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--burger)}
.fab{width:56px;height:56px;margin:-22px auto 0;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(35,24,17,.5)}
.fab svg{width:24px;height:24px}

.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.section-title{font-family:var(--f-display);font-weight:500;font-size:18px;margin:18px 2px 8px}
.muted{color:var(--ink-2)}

/* compare */
.pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker.r{justify-content:flex-end}
.pick{border-radius:50%;padding:2px;border:3px solid transparent;opacity:.55}
.pick.on{border-color:var(--ink);opacity:1}
.vs-badge{font-family:var(--f-display);font-weight:600;color:var(--cream);background:var(--ink);border-radius:999px;padding:4px 10px;font-size:14px}
.match{display:flex;align-items:center;gap:14px}
.match .pct{font-family:var(--f-display);font-weight:600;letter-spacing:-.03em;font-size:44px;line-height:1;color:var(--tacos-ink)}
.match p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.35}
.duo{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow);text-align:left}
.duo .scores{display:flex;align-items:center;gap:6px}
.duo .s{display:flex;flex-direction:column;align-items:center;gap:3px}
.diff{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--cream-2);color:var(--ink-2);white-space:nowrap}
.diff.agree{background:#D7F5E6;color:var(--tacos-ink)}
.diff.far{background:#FFE0D6;color:var(--burger-ink)}
.solo{display:flex;flex-wrap:wrap;gap:6px}
.avs{display:flex}
.avs .av{margin-left:-6px;border:2px solid var(--card)}
.avs .av:first-child{margin-left:0}

/* profiles */
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.pcard .pn{font-family:var(--f-display);font-weight:500;font-size:19px}
.pcard .ps{font-size:13px;color:var(--ink-2);margin-top:2px}
.pill-on{font-size:12px;font-weight:700;background:#D7F5E6;color:var(--tacos-ink);border-radius:999px;padding:4px 10px}
.small-btn{font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;background:var(--cream-2)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cream-2)}
.icon-btn svg{width:18px;height:18px}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--sc,#BFA98F)}

/* map */
.map-wrap{position:relative;z-index:0;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);background:#EAE4D8}
#map{height:max(380px, calc(100vh - 330px));width:100%}
.map-btn{position:absolute;z-index:1000;right:10px;bottom:10px;background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.leaflet-container{font-family:var(--f-body)!important}
.leaflet-container img{max-width:none!important}
.leaflet-div-icon{background:none!important;border:0!important}
.pin{width:44px;height:44px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:var(--b);border:3px solid #fff;box-shadow:0 4px 10px rgba(42,28,18,.35);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--bt);line-height:1}

.me-dot{width:18px;height:18px;border-radius:50%;background:#3A86FF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(58,134,255,.25)}
.leaflet-popup-content-wrapper{border-radius:18px!important;background:var(--card)!important}
.leaflet-popup-tip{background:var(--card)!important}
.leaflet-popup-content{margin:12px 14px!important;min-width:200px}
.pop h4{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 2px}
.pop .addr{font-size:12px;color:var(--ink-2);margin-bottom:8px}
.pop-row .ico{width:18px;height:18px;color:var(--cc)}
.pop-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14px}
.pop-row .grow{flex:1}

/* sheets */
#sheet{position:fixed;inset:0;z-index:2000;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(42,28,18,.45);animation:fade .2s}
.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:92%;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s cubic-bezier(.2,.9,.3,1.1)}
.panel.full{top:0;max-height:none;border-radius:0;display:flex;flex-direction:column;padding:0}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1.5px solid var(--line)}
.sheet-head .t{text-align:center;font-family:var(--f-display);font-weight:500;font-size:18px}
.sheet-head .steps{font-size:12px;color:var(--ink-2);text-align:right;font-weight:700}
.sheet-body{flex:1;overflow:auto;padding:16px}
.sheet-body > *{max-width:520px;margin-left:auto;margin-right:auto}
.sheet-foot{padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1.5px solid var(--line);background:var(--cream)}
.sheet-foot > *{max-width:488px;margin:0 auto}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.lab{font-weight:700;font-size:14px}
.opt{font-weight:700;color:var(--ink-2);font-size:12.5px}
.input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.input:focus{border-color:var(--ink);outline:none}
textarea.input{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prefix{position:relative}
.prefix span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-weight:700}
.prefix .input{padding-left:28px}
.catgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border-radius:var(--r-md);background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:12px}
.ctile .e{width:24px;height:24px;color:var(--cc)}
.ctile.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.ctile:disabled{opacity:.35}
.ctile.on:disabled{opacity:1}
.photo{display:grid;place-items:center;gap:6px;min-height:120px;border:1.5px dashed var(--line);border-radius:var(--r-md);background:var(--card);color:var(--ink-2);font-weight:700;cursor:pointer;overflow:hidden;position:relative}
.photo img{width:100%;max-height:240px;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.err{background:#FFE0D6;color:var(--burger-ink);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pinned{display:flex;align-items:center;gap:10px;background:#D7F5E6;color:var(--tacos-ink);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
.pinned span{flex:1;overflow-wrap:anywhere}
.geo-results{display:flex;flex-direction:column;gap:6px}
.geo-results button{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.geo-results b{display:block}
.geo-results small{color:var(--ink-2);font-size:12.5px}
.cat.add{color:var(--ink-2);border-style:dashed}
.list-tools{display:flex;gap:6px;align-items:center}
.want-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:var(--r-md);padding:8px 10px;box-shadow:var(--shadow);border:1.5px dashed var(--line)}
.want-row .star{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb, var(--cc) 14%, var(--card));color:var(--cc);font-size:20px}
.want-row .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.want-row .sub{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-size:13px;margin-top:2px;min-width:0}
.want-row .sub span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.want-n{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--cream-2);border-radius:999px;padding:3px 9px;white-space:nowrap}
.pin.want{background:var(--card);border:3px dashed var(--grape)}
.pin.want span{color:var(--grape);font-size:17px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.react{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:17px;line-height:1}
.react b{font-size:13px;font-weight:800;color:var(--ink-2)}
.react.on{border-color:var(--ink);background:var(--cream-2)}
.comments{display:flex;flex-direction:column;gap:10px;margin:8px 0 12px}
.cmt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.cmt .bub{background:var(--card);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14.5px;line-height:1.35;box-shadow:var(--shadow);overflow-wrap:anywhere}
.cmt .cwho{font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:2px;display:flex;gap:8px;align-items:center}
.cmt .cwho button{font-size:11px;font-weight:700;color:var(--burger-ink)}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const norm = s => String(s||'').toLowerCase().replace(/^the\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const hasPin = it => typeof it.lat==='number' && typeof it.lng==='number';
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
const today = () => ymd(new Date());
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function tierOf(s){ return s>=9?'S':s>=8?'A':s>=6.7?'B':s>=5?'C':'D'; }
function bucketForScore(s){ return s>=6.7?BUCKET.liked:s>=3.4?BUCKET.fine:BUCKET.disliked; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }

/* ============ state ============ */
let S = { profiles:[], activeId:null, orders:{}, items:{}, wants:{}, reacts:{}, comments:{}, cats:{} };
function ensureS(){ S.orders??={}; S.items??={}; S.wants??={}; S.reacts??={}; S.comments??={}; S.cats??={}; }
const extraObj = () => ({wants:S.wants, reacts:S.reacts, comments:S.comments, cats:S.cats});
const ui = { tab:'lists', cat:'burger', style:'all', area:'',
  areaScope:'me', areaCat:'all', areaMin:false,
  mapScope:'me', mapCat:'all', mapFit:true, mapFocus:null,
  crew:'feed', pickWho:null, pickCat:'all', pickArea:'', pickSurprise:null, mapWants:true, recapYear:null,
  cmpA:null, cmpB:null, cmpCat:'burger', groupCat:'burger', groupMin2:false,
  sheet:null, flash:null };
let flow = null;
let persisted = false;
let syncMode = IN_CLAUDE ? 'device' : 'local';

const profile = id => S.profiles.find(p=>p.id===id);
const activeProfile = () => profile(S.activeId) || S.profiles[0];
function catOrder(pid,cat){
  S.orders[pid] ??= {};
  S.orders[pid][cat] ??= {liked:[],fine:[],disliked:[]};
  return S.orders[pid][cat];
}
function hasDemo(){ return Object.values(S.items).some(i=>i.demo) || S.profiles.some(p=>p.demo); }

/* ============ scoring ============
   1. The bucket sets the score range.
   2. Within a bucket items are spread evenly by position: score = lo + (hi-lo) * (n-i)/(n+1).
   3. Tied items share the average of their slots. */
function ranked(pid,cat){
  const o = catOrder(pid,cat); const out=[];
  for(const b of BUCKETS){
    const ids = o[b.k].filter(id=>S.items[id]); const n=ids.length;
    const raw = ids.map((id,i)=> b.lo + (b.hi-b.lo)*(n-i)/(n+1));
    let i=0;
    while(i<n){
      let j=i; const g=S.items[ids[i]].tie;
      if(g){ while(j+1<n && S.items[ids[j+1]].tie===g) j++; }
      const avg = raw.slice(i,j+1).reduce((a,c)=>a+c,0)/(j-i+1);
      for(let k=i;k<=j;k++) out.push({item:S.items[ids[k]], score:Math.round(avg*10)/10, bucket:b, tied:j>i});
      i=j+1;
    }
  }
  out.forEach((r,idx)=>{
    const prev=out[idx-1];
    r.rank = (prev && r.tied && prev.tied && prev.item.tie===r.item.tie) ? prev.rank : idx+1;
    r.tier = tierOf(r.score);
  });
  return out;
}
function rankedMany(pids, cats){ const out=[]; pids.forEach(pid=>cats.forEach(c=>ranked(pid,c).forEach(r=>out.push({...r, pid})))); return out; }
function keyedRanks(pid,cat){
  const rows=ranked(pid,cat); const per={};
  rows.forEach(r=>{ const k=norm(r.item.place); per[k]=(per[k]||0)+1; });
  const m=new Map();
  rows.forEach(r=>{ const pk=norm(r.item.place); const k=per[pk]>1? pk+'|'+norm(r.item.dish) : pk; if(!m.has(k)) m.set(k,r); });
  return m;
}
function removeFromOrder(item){
  const o=catOrder(item.profileId,item.cat);
  for(const b of BUCKETS) o[b.k]=o[b.k].filter(id=>id!==item.id && S.items[id]);
  const changed=[];
  if(item.tie){
    const g=item.tie; item.tie=null;
    const left=Object.values(S.items).filter(i=>i.id!==item.id && i.tie===g);
    if(left.length===1){ left[0].tie=null; changed.push(left[0].id); }
  }
  return changed;
}
// Areas: the Location field, matched case-insensitively.
function areaNames(items){ const m=new Map(); items.forEach(it=>{ const k=norm(it.location); if(k && !m.has(k)) m.set(k, it.location.trim()); }); return m; }

/* ============ storage ============
   Device: IndexedDB (room for photos), falling back to localStorage.
   Claude: the same, plus each item synced to the viewer's private space in the Claude account. */
const LS_KEY='tummi_v1';
function metaObj(){ return {v:2, profiles:S.profiles, activeId:S.activeId, orders:S.orders}; }
const idb={
  db:null,
  open(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('no idb')); const r=indexedDB.open('tummi',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(this.db=r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ const db=this.db||await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const db=this.db||await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
};
let saveTimer=null;
function saveLocal(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    const snap={meta:clone(metaObj()), items:clone(S.items), extra:clone(extraObj()), sync:crewSync?clone(crewSync):null};
    try{ await idb.set('state', snap); try{ localStorage.removeItem(LS_KEY); }catch(_){} return; }catch(e){}
    try{ localStorage.setItem(LS_KEY, JSON.stringify(snap)); }
    catch(e){ try{ const lite={}; for(const [k,v] of Object.entries(snap.items)) lite[k]={...v, photo:null}; localStorage.setItem(LS_KEY, JSON.stringify({meta:snap.meta, items:lite})); toast('Storage is full, so photos were not saved.'); }catch(_){} }
  },150);
}
async function loadLocal(){
  let d=null;
  try{ d=await idb.get('state'); }catch(e){}
  if(!d){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) d=JSON.parse(raw); }catch(e){} }
  if(!d || !d.meta || !d.meta.profiles?.length) return false;
  applySnapshot(d); crewSync=d.sync||null; return true;
}
function applySnapshot(d){ const x=d.extra||{}; S={profiles:d.meta.profiles, activeId:d.meta.activeId, orders:d.meta.orders||{}, items:d.items||{}, wants:x.wants||{}, reacts:x.reacts||{}, comments:x.comments||{}, cats:x.cats||{}}; rebuildCats(); }

let remote=null; const queues={}; let metaTimer=null;
function enqueue(key, fn){
  const run=()=>fn().catch(async e=>{ if(e && e.code==='unavailable'){ await sleep(400+Math.random()*800); return fn(); } throw e; });
  queues[key]=(queues[key]||Promise.resolve()).then(run).catch(onRemoteError);
}
function onRemoteError(e){
  const c=e && e.code;
  if(c==='quota_exceeded'){ toast('Your Tummi storage is full. Delete a few photos or items.'); return; }
  if(['invalid_argument','revoked','not_granted','capability_disabled','capability_removed'].includes(c)){
    remote=null; syncMode='device'; render(); toast("Couldn't save to your account. Saving on this device only."); return;
  }
  toast('Sync hiccup. Your changes are saved on this device.');
}
function commit({items=[], del=[]}={}){
  if(!persisted){ persisted=true; items=Object.keys(S.items); try{ navigator.storage?.persist?.(); }catch(_){} }
  saveLocal();
  if(crew) scheduleSync();
  if(!remote) return;
  items.forEach(id=>{ const it=S.items[id]; if(it) enqueue('item_'+id, ()=>remote.col.doc('item_'+id).set(clone(it))); });
  del.forEach(id=>enqueue('item_'+id, ()=>remote.col.doc('item_'+id).delete()));
  clearTimeout(metaTimer);
  metaTimer=setTimeout(()=>enqueue('meta', ()=>remote.col.doc('meta').set(clone(metaObj()))), 350);
}
async function connectRemote(){
  if(!IN_CLAUDE || typeof claude==='undefined' || !claude.use) return;
  syncMode='connecting'; render();
  try{
    const [db,user]=await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user){ syncMode='device'; render(); return; }
    const id=await user.id();
    if(!id){ syncMode='device'; render(); return; }
    const col=db.collection('data/users/'+id);
    const timer=setTimeout(()=>{ if(syncMode==='connecting'){ syncMode='device'; render(); toast("Can't reach your account yet. Saving on this device."); } },10000);
    const snap=await col.limit(1000).get();
    clearTimeout(timer);
    let meta=null; const items={};
    snap.docs.forEach(d=>{ const v=d.data(); if(d.id==='meta') meta=v; else if(d.id.startsWith('item_') && v && v.id) items[v.id]=clone(v); });
    remote={col}; syncMode='cloud';
    if(meta && meta.profiles?.length){ applySnapshot({meta:clone(meta), items}); persisted=true; saveLocal(); }
    else if(persisted){ commit({items:Object.keys(S.items)}); }
    render();
  }catch(e){ syncMode='device'; render(); }
}

/* ============ shared crew (hosted version) ============
   Everyone in a crew shares one set of profiles and rankings through Firebase Firestore.
   The crew's id is a SHA-256 of its name + passcode, so only people who know both can reach it.
   Docs: profile_<id>, orders_<profileId>, item_<id>. Which profile you are stays on the device.
   crewSync.h remembers a hash of each doc as last agreed with the server, so we only send what
   changed here and only take remote changes for docs we haven't edited since. */
let crew=null, crewSync=null, syncBusy=false, syncAgain=false, syncTimer=null, crewErr='', lastSyncAt=0;
try{ crew=CREW_ON ? JSON.parse(localStorage.getItem('tummi_crew')||'null') : null; }catch(_){ crew=null; }
function saveCrew(){ try{ crew ? localStorage.setItem('tummi_crew', JSON.stringify(crew)) : localStorage.removeItem('tummi_crew'); }catch(_){} }
function hashStr(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return (h>>>0).toString(36)+'.'+str.length; }
const FS_ROOT = `projects/${FIREBASE.projectId}/databases/(default)/documents`;
async function sha256hex(str){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function crewKeys(name, pass){ const n=name.trim().toLowerCase(); return {nameKey:await sha256hex('tummi-name|'+n), cid:await sha256hex('tummi-crew|'+n+'|'+pass)}; }
async function fsReq(method, path, body){
  const url=`${FIRESTORE_HOST}/v1/${FS_ROOT}${path}${path.includes('?')?'&':'?'}key=${encodeURIComponent(FIREBASE.apiKey)}`;
  let r;
  try{ r=await fetch(url,{method, headers:body?{'Content-Type':'application/json'}:{}, body:body?JSON.stringify(body):undefined}); }
  catch(e){ const err=new Error("Can't reach the crew right now."); err.offline=true; throw err; }
  const txt=await r.text(); let res=null; try{ res=txt?JSON.parse(txt):null; }catch(_){}
  if(!r.ok){ const e0=(Array.isArray(res)?res[0]:res)?.error||{}; const err=new Error(e0.message||('Server error '+r.status)); err.status=e0.status||String(r.status); throw err; }
  return res;
}
const fsExists=path=>fsReq('GET',path).then(()=>true, e=>{ if(e.status==='NOT_FOUND') return false; throw e; });
const fsCreate=(coll,id)=>fsReq('POST',`/${coll}?documentId=${id}`,{fields:{created:{timestampValue:new Date().toISOString()}}});
async function crewOpen(name, pass, create){
  const {nameKey, cid}=await crewKeys(name, pass);
  if(await fsExists('/crews/'+cid)) return cid;              // right name + passcode, whichever button was tapped
  if(!create){ const err=new Error('Wrong crew name or passcode.'); err.code='badpass'; throw err; }
  if(await fsExists('/names/'+nameKey)){ const err=new Error('That crew name is taken.'); err.code='taken'; throw err; }
  await fsCreate('names', nameKey); await fsCreate('crews', cid);
  return cid;
}
async function crewPull(cid, since){
  const q={from:[{collectionId:'docs'}]};
  if(since) q.where={fieldFilter:{field:{fieldPath:'updatedAt'}, op:'GREATER_THAN', value:{timestampValue:since}}};
  const res=await fsReq('POST', `/crews/${cid}:runQuery`, {structuredQuery:q});
  let now=null; const docs=[];
  for(const row of res||[]){
    if(row.readTime) now=row.readTime;
    if(!row.document) continue;
    const id=row.document.name.split('/').pop(); const f=row.document.fields||{};
    const del=!!f.deleted?.booleanValue; if(del && !since) continue;
    let data=null; if(!del){ try{ data=JSON.parse(f.data?.stringValue||'null'); }catch(_){ continue; } if(!data) continue; }
    docs.push({id, data});
  }
  return {now:(now||new Date().toISOString()).replace(/(\.\d{3})\d*Z$/,'$1Z'), docs};
}
function crewPush(cid, docs){
  return fsReq('POST', ':commit', {writes:docs.map(d=>({
    update:{name:`${FS_ROOT}/crews/${cid}/docs/${d.id}`, fields:{data:{stringValue:d.data?JSON.stringify(d.data):''}, deleted:{booleanValue:!d.data}}},
    updateTransforms:[{fieldPath:'updatedAt', setToServerValue:'REQUEST_TIME'}]}))});
}
function crewDocs(){
  const out={};
  const demoItem=id=>S.items[id]?.demo;
  for(const p of S.profiles) if(!p.demo) out['profile_'+p.id]=p;
  for(const [pid,o] of Object.entries(S.orders)){
    if(!profile(pid) || profile(pid).demo) continue;
    const c={}; for(const [cat,bk] of Object.entries(o)){ c[cat]={}; for(const b of BUCKETS) c[cat][b.k]=(bk[b.k]||[]).filter(id=>!demoItem(id)); }
    out['orders_'+pid]=c;
  }
  for(const it of Object.values(S.items)) if(!it.demo) out['item_'+it.id]=it;
  ensureS();
  for(const [k,v] of Object.entries(S.wants)) out['want_'+k]=v;
  for(const [k,v] of Object.entries(S.reacts)) if(!S.items[v.itemId]?.demo) out['react_'+k]=v;
  for(const [k,v] of Object.entries(S.comments)) if(!S.items[v.itemId]?.demo) out['comment_'+k]=v;
  for(const [k,v] of Object.entries(S.cats)) out['cat_'+k]=v;
  return out;
}
function applyDoc(id, data){
  if(id.startsWith('profile_')){ const pid=id.slice(8); const i=S.profiles.findIndex(p=>p.id===pid);
    if(data){ i>=0 ? (S.profiles[i]=clone(data)) : S.profiles.push(clone(data)); } else if(i>=0) S.profiles.splice(i,1); }
  else if(id.startsWith('orders_')){ const pid=id.slice(7); if(data) S.orders[pid]=clone(data); else delete S.orders[pid]; }
  else if(id.startsWith('item_')){ const iid=id.slice(5); if(data) S.items[iid]=clone(data); else delete S.items[iid]; }
  else { ensureS();
    const m=/^(want|react|comment|cat)_(.+)$/.exec(id); if(!m) return;
    const coll={want:S.wants, react:S.reacts, comment:S.comments, cat:S.cats}[m[1]];
    if(data) coll[m[2]]=clone(data); else delete coll[m[2]];
    if(m[1]==='cat') rebuildCats(); }
}
function stripDemo(){
  for(const it of Object.values(S.items)) if(it.demo) delete S.items[it.id];
  S.profiles=S.profiles.filter(p=>!p.demo || Object.values(S.items).some(i=>i.profileId===p.id));
  for(const pid in S.orders){ if(!profile(pid)){ delete S.orders[pid]; continue; }
    for(const cat in S.orders[pid]) for(const b of BUCKETS) S.orders[pid][cat][b.k]=(S.orders[pid][cat][b.k]||[]).filter(id=>S.items[id]); }
  for(const it of Object.values(S.items)) if(it.tie==='tdemo') it.tie=null;
}
function scheduleSync(ms=600){ clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, ms); }
async function syncNow(){
  if(!crew) return;
  if(syncBusy){ syncAgain=true; return; }
  syncBusy=true; syncAgain=false;
  crewSync ??= {cursor:null, h:{}};
  const h=crewSync.h;
  try{
    // push what changed on this phone
    const cur=crewDocs(); const out=[];
    for(const [id,doc] of Object.entries(cur)){ const str=JSON.stringify(doc); const hs=hashStr(str); if(h[id]!==hs) out.push({id, data:doc, hs, size:str.length}); }
    for(const id of Object.keys(h)) if(!(id in cur)) out.push({id, data:null, hs:null, size:20});
    let batch=[], size=0;
    const flush=async()=>{ if(!batch.length) return; await crewPush(crew.cid, batch);
      batch.forEach(d=>{ d.hs ? (h[d.id]=d.hs) : delete h[d.id]; }); batch=[]; size=0; };
    for(const d of out){ if(size+d.size>1500000 || batch.length>=400) await flush(); batch.push(d); size+=d.size; }
    await flush();
    // pull what others changed (not while a sheet is open, so nothing moves under you)
    const quietSheet=!ui.sheet || ['item','want','recap','switcher'].includes(ui.sheet.type);
    if(quietSheet){
      const since=crewSync.cursor ? new Date(new Date(crewSync.cursor).getTime()-15000).toISOString() : null;
      const res=await crewPull(crew.cid, since);
      const now=crewDocs(); let changed=false;
      for(const {id,data} of res.docs||[]){
        const local=now[id]? hashStr(JSON.stringify(now[id])) : undefined;
        if(local!==h[id]) continue;                 // edited here since last sync; ours goes up next round
        const remoteH=data? hashStr(JSON.stringify(data)) : undefined;
        if(remoteH===local) continue;
        if(hasDemo()) stripDemo();
        applyDoc(id, data); remoteH ? (h[id]=remoteH) : delete h[id]; changed=true;
      }
      crewSync.cursor=res.now;
      if(changed){
        if(!S.profiles.length) S.profiles=[{id:'p_'+uid(), name:'Me', color:P_COLORS[0]}];
        if(!profile(S.activeId)) S.activeId=S.profiles[0].id;
        renderMain();
        if(ui.sheet && document.activeElement?.id!=='c-text') renderSheet();
      }
    }
    crewErr=''; lastSyncAt=Date.now(); syncMode='crew';
  }catch(e){
    if(e.status==='PERMISSION_DENIED'){ crewErr='The crew passcode no longer works. Leave the crew and join again.'; }
    else crewErr=e.offline ? "Can't reach the crew. Changes are saved here and will sync later." : 'Sync hiccup: '+e.message;
    syncMode='crew-err';
  }finally{
    syncBusy=false; saveLocal();
    if(ui.tab==='crew' && ui.crew==='profiles' && !ui.sheet) renderMain();
    if(syncAgain) scheduleSync(300);
  }
}
async function joinCrew(code, pass, create, bring){
  const cid=await crewOpen(code, pass, create);
  const res=await crewPull(cid, null);
  const remoteDocs=res.docs||[];
  const mine= bring ? (stripDemo(), clone(S)) : null;
  const myActive=activeProfile();
  S={profiles:[], activeId:null, orders:{}, items:{}, wants:{}, reacts:{}, comments:{}, cats:{}};
  crewSync={cursor:res.now, h:{}};
  for(const {id,data} of remoteDocs){ if(!data) continue; applyDoc(id,data); crewSync.h[id]=hashStr(JSON.stringify(data)); }
  let me=null;
  if(mine && mine.profiles.length){
    // bring this phone's profiles along; same name means same person
    const map={};
    for(const p of mine.profiles){
      const same=S.profiles.find(x=>norm(x.name)===norm(p.name));
      if(same) map[p.id]=same.id;
      else { const np={...p, id:(p.id==='p_me'||profile(p.id))?'p_'+uid():p.id, demo:false}; S.profiles.push(np); map[p.id]=np.id; }
    }
    for(const it of Object.values(mine.items)){ S.items[it.id]={...it, profileId:map[it.profileId]||it.profileId, withIds:(it.withIds||[]).map(x=>map[x]||x)}; }
    for(const [pid,o] of Object.entries(mine.orders)){
      const to=map[pid]||pid;
      for(const [cat,bk] of Object.entries(o)){ for(const b of BUCKETS){ const dst=catOrder(to,cat)[b.k]; for(const id of bk[b.k]||[]) if(!dst.includes(id)) dst.push(id); } }
    }
    me=map[mine.activeId]||null;
    const mp=x=>map[x]||x;
    for(const w of Object.values(mine.wants||{})) S.wants[w.id]={...w, addedBy:mp(w.addedBy), wantIds:(w.wantIds||[]).map(mp)};
    for(const c of Object.values(mine.comments||{})) S.comments[c.id]={...c, pid:mp(c.pid)};
    for(const r of Object.values(mine.reacts||{})){ const pid=mp(r.pid); S.reacts[r.itemId+'__'+pid]={...r, pid}; }
    for(const c of Object.values(mine.cats||{})) if(!S.cats[c.k]) S.cats[c.k]=c;
    rebuildCats();
  }
  crew={name:code.trim(), cid};
  saveCrew();
  let fresh=false;
  if(!S.profiles.length){ S.profiles=[{id:'p_'+uid(), name:(myActive&&!myActive.demo&&myActive.name)||'Me', color:(myActive&&myActive.color)||P_COLORS[0]}]; fresh=true; }
  S.activeId= me || S.profiles[0].id;
  ui.cmpA=S.activeId; persisted=true; syncMode='crew';
  saveLocal(); startCrewLoop(); await syncNow();
  return {fresh, picked:!!me};
}
let crewLoop=false;
function startCrewLoop(){
  if(crewLoop) return; crewLoop=true;
  setInterval(()=>{ if(crew && document.visibilityState==='visible') syncNow(); }, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(crew && document.visibilityState==='visible') syncNow(); });
  addEventListener('online', ()=>{ if(crew) syncNow(); });
}
function leaveCrew(){ crew=null; crewSync=null; crewErr=''; saveCrew(); syncMode='local'; saveLocal(); }

/* ============ backup (hosted version) ============ */
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'tummi', exported:new Date().toISOString(), meta:metaObj(), items:S.items, extra:extraObj()})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`tummi-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
async function importBackup(file){
  try{ const d=JSON.parse(await file.text()); if(d.app!=='tummi' || !d.meta?.profiles?.length) throw 0;
    applySnapshot(d); persisted=false; commit(); render(); toast('Backup restored');
  }catch(e){ toast("That file isn't a Tummi backup."); }
}

/* ============ demo data ============ */
function buildDemo(){
  const me = activeProfile();

  const marco={id:'p_marco', name:'Marco', color:'#3E7BD6', demo:true};

  // [style, town, offset lat, offset lng]
  const P={
    'Smash Shack':['Smash','Ferndale',.004,-.003], 'Big Bun Diner':['Diner','Royal Oak',-.003,.004], "Sully's Pub":['Pub','Detroit',.006,.008], 'Patty Wagon':['Double','Ann Arbor',.003,.006],
    'Griddle House':['Smash','Ann Arbor',-.004,-.005], 'Burger Barn':['Gourmet','Ypsilanti',.002,.003],
    'Square Deal Pies':['Detroit','Detroit',-.005,-.006], "Nonna's Oven":['Neapolitan','Ferndale',-.003,.005], 'Slice Bros':['NY','Ann Arbor',.006,-.002], 'Tavern on 5th':['Tavern','Royal Oak',.004,-.004],
    'Crust & Co.':['Sicilian','Grand Rapids',.003,.004], 'Pie Hole':['NY','Ypsilanti',-.003,-.004],
    'Taqueria El Sol':['Al pastor','Detroit',-.002,-.03], 'Birria Boyz':['Birria','Detroit',.008,-.025], 'Casa Verde':['Carnitas','Grand Rapids',-.004,-.003], 'Taco Tuesday Truck':['Asada','Ann Arbor',.001,.009],
    'Flap Shack':['Buffalo','Royal Oak',.001,.002], 'Hot Coop':['Korean','Ann Arbor',-.006,.003], 'Bonfire Wings':['Dry rub','Ferndale',.006,.002], 'Saucy Bird':['Garlic parm','Grand Rapids',.005,-.006],
    'Ember Chophouse':['Ribeye','Detroit',.003,.002], 'Prime & Pine':['Filet','Grand Rapids',-.002,.006], 'Cattle Call':['NY strip','Royal Oak',-.005,.001],
  };
  const plan={
    [me.id]:{burger:{liked:['Smash Shack','Patty Wagon','Griddle House'],fine:['Big Bun Diner',"Sully's Pub"],disliked:['Burger Barn']},
             pizza:{liked:['Square Deal Pies',"Nonna's Oven",'Slice Bros'],fine:['Pie Hole','Tavern on 5th'],disliked:['Crust & Co.']},
             tacos:{liked:['Birria Boyz','Taqueria El Sol'],fine:['Casa Verde']},
             wings:{liked:['Hot Coop'],fine:['Flap Shack','Bonfire Wings']},
             steak:{liked:['Ember Chophouse','Prime & Pine'],fine:['Cattle Call']}},
    p_jess:{burger:{liked:['Griddle House','Smash Shack'],fine:['Patty Wagon','Burger Barn'],disliked:["Sully's Pub"]},
            pizza:{liked:["Nonna's Oven",'Slice Bros'],fine:['Square Deal Pies'],disliked:['Pie Hole']},
            tacos:{liked:['Taqueria El Sol','Casa Verde']},
            wings:{liked:['Saucy Bird','Hot Coop']},
            steak:{liked:['Prime & Pine'],fine:['Ember Chophouse']}},
    p_marco:{burger:{liked:['Smash Shack','Big Bun Diner','Patty Wagon'],fine:['Griddle House']},
             pizza:{liked:['Square Deal Pies','Tavern on 5th','Slice Bros'],fine:["Nonna's Oven"]},
             tacos:{liked:['Birria Boyz'],fine:['Taqueria El Sol','Taco Tuesday Truck']},
             wings:{liked:['Flap Shack','Bonfire Wings'],disliked:['Saucy Bird']},
             steak:{liked:['Cattle Call','Ember Chophouse']}},
  };
  const prices={burger:[9,16],pizza:[14,26],tacos:[3,6],wings:[11,18],steak:[32,68]};
  let n=0;
  for(const [pid,cats] of Object.entries(plan)){
    for(const [cat,bks] of Object.entries(cats)){
      const o=catOrder(pid,cat);
      for(const [bk,places] of Object.entries(bks)){
        places.forEach(place=>{
          n++; const id='demo'+n; const [a,b]=prices[cat]; const [style,town,dl,dg]=P[place]; const [tl,tg]=T[town];
          S.items[id]={id, profileId:pid, cat, place, dish:'', style, photo:null,
            price:String(a+((n*7)%(b-a+1))), date:ymd(new Date(Date.now()-n*86400000*3)),

          o[bk].push(id);
        });
      }
    }
  }
  const mePizza=catOrder(me.id,'pizza').liked; if(mePizza.length>1){ S.items[mePizza[0]].tie='tdemo'; S.items[mePizza[1]].tie='tdemo'; }

}
function clearDemo(){
  const del=Object.values(S.items).filter(i=>i.demo).map(i=>i.id);
  del.forEach(id=>delete S.items[id]);
  const keep=new Set(Object.values(S.items).map(i=>i.profileId));
  const gone=S.profiles.filter(p=>p.demo && !keep.has(p.id)).map(p=>p.id);
  S.profiles=S.profiles.filter(p=>!gone.includes(p.id));
  gone.forEach(pid=>delete S.orders[pid]);
  for(const pid in S.orders) for(const cat in S.orders[pid]) for(const b of BUCKETS) S.orders[pid][cat][b.k]=S.orders[pid][cat][b.k].filter(id=>S.items[id]);
  for(const it of Object.values(S.items)) if(it.tie==='tdemo') it.tie=null;
  if(!profile(S.activeId)) S.activeId=S.profiles[0].id;
  ui.area=''; ui.mapFit=true;
  commit({del}); toast('Samples cleared');
}

/* ============ components ============ */
function avatar(p,size=30){ if(!p) return ''; return `<span class="av" style="--pc:${p.color};width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px">${esc((p.name||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>`; }
function scoreBubble(score,bucket,size=''){ return `<div class="score ${size}" style="--b:${bucket.color};--bt:${bucket.text}">${score.toFixed(1)}</div>`; }
function tierBadge(t){ return `<span class="tier t-${t}" aria-label="Tier ${t}">${t}</span>`; }
function thumb(it){ const c=CAT[it.cat]; return `<div class="thumb" style="--cc:${c.color}">${it.photo?`<img src="${it.photo}" alt="">`:foodIcon(it.cat)}</div>`; }
function catTag(c){ return `<span class="tag" style="--cc:${c.color}">${foodIcon(c.k)}${c.name}</span>`; }
function catTabs(current, action, counts, withAll){
  const all = withAll? `<button class="cat ${current==='all'?'on':''}" style="--cc:var(--ink);--ct:var(--cream)" data-a="${action}" data-cat="all"><span class="e" style="--cc:currentColor">${FOOD_ICON.all}</span>All foods</button>` : '';
  const add = action==='set-cat' ? `<button class="cat add" data-a="cat-new" aria-label="Add a food category">${ic.plus.replace('<svg','<svg width="14" height="14"')}New</button>` : '';
  return `<div class="cats" role="tablist">${all}${CATS.map(c=>`<button class="cat ${c.k===current?'on':''}" role="tab" aria-selected="${c.k===current}" style="--cc:${c.color};--ct:${c.text}" data-a="${action}" data-cat="${c.k}"><span class="e">${foodIcon(c.k)}</span>${c.name}${counts?`<span class="n num">${counts[c.k]||0}</span>`:''}</button>`).join('')}${add}</div>`;
}
function scopeSeg(current, action){
  return `<div class="seg"><button class="${current==='me'?'on':''}" data-a="${action}" data-v="me">${esc(activeProfile().name)}</button><button class="${current==='all'?'on':''}" data-a="${action}" data-v="all">Everyone</button></div>`;
}
function showInstallHint(){
  if(IN_CLAUDE) return false;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const standalone=navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let hidden=false; try{ hidden=!!localStorage.getItem('tummi_install_hide'); }catch(_){}
  return ios && !standalone && !hidden && ui.tab==='lists';
}
function header(){
  const p=activeProfile();

/* ============ views ============ */
function viewLists(){
  const p=activeProfile(); const c=CAT[ui.cat];
  const rows=ranked(p.id,c.k);
  const counts=Object.fromEntries(CATS.map(x=>[x.k, ranked(p.id,x.k).length]));
  const areas=areaNames(rows.map(r=>r.item));
  if(ui.area && !areas.has(ui.area)){ const all=areaNames(Object.values(S.items)); if(all.has(ui.area)) areas.set(ui.area, all.get(ui.area)); else ui.area=''; }
  let shown = ui.area ? rows.filter(r=>norm(r.item.location)===ui.area) : rows;
  const styles=[...new Set(shown.map(r=>r.item.style).filter(Boolean))];
  if(ui.style!=='all' && !styles.includes(ui.style)) ui.style='all';
  if(ui.style!=='all') shown=shown.filter(r=>r.item.style===ui.style);
  const anyData=Object.keys(S.items).length>0;
  const areaSel = areas.size ? `<label class="select ${ui.area?'on':''}" for="area-filter"><span aria-hidden="true" style="width:16px;height:16px;display:grid;color:var(--burger)">${ic.map}</span><select id="area-filter" data-change="area" aria-label="Filter by area"><option value="">All areas</option>${[...areas].sort((a,b)=>a[1].localeCompare(b[1])).map(([k,v])=>`<option value="${esc(k)}" ${k===ui.area?'selected':''}>${esc(v)}</option>`).join('')}</select>${ic.chev}</label>` : '';
  return `${catTabs(ui.cat,'set-cat',counts)}
    <div class="list-head"><h2>${esc(p.name)}'s ${c.name.toLowerCase()}</h2><div class="list-tools"><span class="sub num">${rows.length} ranked</span>${c.custom?`<button class="icon-btn" data-a="cat-edit" data-k="${c.k}" aria-label="Edit ${esc(c.name)} category">${ic.pen}</button>`:''}${rows.length&&!IN_CLAUDE?`<button class="small-btn" data-a="share-top">Share</button>`:''}</div></div>
    ${areaSel||styles.length>1?`<div class="filters">${areaSel}${ui.area?'<button class="small-btn" data-a="clear-area">Clear</button>':''}</div>`:''}
    ${styles.length>1?`<div class="chips" aria-label="Filter by style"><button class="chip ${ui.style==='all'?'on':''}" data-a="style" data-v="all">All styles</button>${styles.map(s=>`<button class="chip ${ui.style===s?'on':''}" data-a="style" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}
    ${rows.length && rows.length<MIN_FOR_STABLE?`<div class="note"><span class="dot"></span><span><b>Still calibrating.</b> Scores settle once you've ranked ${MIN_FOR_STABLE} ${c.name.toLowerCase()}. With only a few, everything sits near the middle of its range.</span></div>`:''}
    ${ui.area && rows.length?`<p class="muted" style="font-size:13px;margin:-2px 4px 10px">Ranks are out of all ${rows.length} of ${esc(p.name)}'s ${c.name.toLowerCase()}, not just ${esc(areas.get(ui.area))}.</p>`:''}
    ${shown.length?`<div class="list">${shown.map(row).join('')}</div>`:
      rows.length?`<div class="empty" style="--cc:${c.color}"><div class="big">${foodIcon(c.k)}</div><h3>None in ${esc(areas.get(ui.area)||'this area')}</h3><p>${esc(p.name)} hasn't ranked ${c.name.toLowerCase()} here yet.</p><button class="btn" data-a="clear-area">Show all areas</button></div>`:
      `<div class="empty" style="--cc:${c.color}"><div class="big">${foodIcon(c.k)}</div><h3>No ${c.name.toLowerCase()} yet</h3><p>Log one and Tummi will slot it in with a few quick head-to-heads.</p>
       <button class="btn accent" style="--cc:${c.color};--ct:${c.text}" data-a="add" data-cat="${c.k}">Rank a ${c.one}</button>
       ${!anyData?'<button class="btn" data-a="demo">Load sample data</button>':''}</div>`}
    ${wantSection(c)}`;
}

function wantRow(w){
  const c=CAT[w.cat]; const who=(w.wantIds||[]).map(profile).filter(Boolean);

/* Areas: average score of everything ranked in each area. */
function viewAreas(){
  const p=activeProfile();
  const pids= ui.areaScope==='me'? [p.id] : S.profiles.map(x=>x.id);
  const cats= ui.areaCat==='all'? CATS.map(c=>c.k) : [ui.areaCat];
  const rows=rankedMany(pids,cats);
  const noLoc=rows.filter(r=>!norm(r.item.location)).length;
  const names=areaNames(rows.map(r=>r.item));
  const groups=new Map();
  rows.forEach(r=>{ const k=norm(r.item.location); if(!k) return; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); });
  let areas=[...groups].map(([k,rs])=>{
    const avg=rs.reduce((s,r)=>s+r.score,0)/rs.length;
    const best=rs.reduce((m,r)=>r.score>m.score?r:m);
    const spots=new Set(rs.map(r=>norm(r.item.place))).size;
    const per=CATS.map(c=>[c, rs.filter(r=>r.item.cat===c.k).length]).filter(x=>x[1]);
    return {k, name:names.get(k), avg:Math.round(avg*10)/10, n:rs.length, spots, best, per};
  });
  if(ui.areaMin) areas=areas.filter(a=>a.n>=3);
  areas.sort((a,b)=>b.avg-a.avg || b.n-a.n);
  return `${scopeSeg(ui.areaScope,'area-scope')}${catTabs(ui.areaCat,'area-cat',null,true)}
    <div class="list-head"><h2>Best areas</h2><span class="sub num">${groups.size} ${groups.size===1?'area':'areas'}</span></div>

    ${areas.length?`<div class="list">${areas.map((a,i)=>{ const b=bucketForScore(a.avg);
      return `<button class="row area" style="--bc:${b.color}" data-a="open-area" data-k="${esc(a.k)}"><div class="rank num">${i+1}</div>
        <div class="meta"><div class="name">${esc(a.name)}</div>
          <div class="sub"><span class="num">${a.spots} ${a.spots===1?'spot':'spots'} · ${a.n} ${a.n===1?'ranking':'rankings'}</span><span>${a.per.map(([c,n])=>`${c.name} ${n}`).join(' · ')}</span></div>
          <div class="sub">Best: ${esc(a.best.item.place)} (${CAT[a.best.item.cat].one}) <b class="num">${a.best.score.toFixed(1)}</b></div></div>
        <div class="right">${scoreBubble(a.avg,b)}${tierBadge(tierOf(a.avg))}</div></button>`; }).join('')}</div>`
      :`<div class="empty"><div class="big">${ic.map}</div><h3>No areas yet</h3><p>Fill in Location when you rank something and areas will show up here.</p></div>`}
    <p class="muted" style="font-size:13px;margin:14px 4px;line-height:1.4">An area's score is the average of every ranking there. Areas come from the Location field, so keep names consistent (Royal Oak, not RO).${noLoc?` ${noLoc} ${noLoc===1?'ranking has':'rankings have'} no location yet.`:''}</p>`;
}

    const s=document.createElement('script'); s.src=LEAFLET_JS; s.onload=res; s.onerror=()=>{ leafletP=null; rej(); }; document.head.appendChild(s);

function mapGroups(){
  const p=activeProfile();
  const pids= ui.mapScope==='me'? [p.id] : S.profiles.map(x=>x.id);
  const cats= ui.mapCat==='all'? CATS.map(c=>c.k) : [ui.mapCat];
  const rows=rankedMany(pids,cats);
  const g=new Map(); let unpinned=0;
  rows.forEach(r=>{ const it=r.item; if(!hasPin(it)){ unpinned++; return; }
    const k=norm(it.place)+'@'+it.lat.toFixed(3)+','+it.lng.toFixed(3);
    if(!g.has(k)) g.set(k,{place:it.place, address:it.address||it.location||'', lat:it.lat, lng:it.lng, rows:[]});
    g.get(k).rows.push(r); });
  const groups=[...g.values()].map(x=>{ const avg=x.rows.reduce((s,r)=>s+r.score,0)/x.rows.length; const cats=[...new Set(x.rows.map(r=>r.item.cat))];
    return {...x, score:Math.round((ui.mapScope==='me'? Math.max(...x.rows.map(r=>r.score)) : avg)*10)/10, cats}; });

async function mountMap(){

  if(lmap){ lmap.remove(); lmap=null; }
  lmap=L.map(el,{zoomControl:true, attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,

  } else lmap.setView(prev.c, prev.z);
  if(meMarker){ meMarker.addTo(lmap); }
}
function locateMe(){
  if(!navigator.geolocation){ toast('Location isn\'t available in this browser.'); return; }

function feedEvents(){
  const ev=[];
  for(const it of Object.values(S.items)) if(profile(it.profileId) && CAT[it.cat]) ev.push({t:it.createdAt||0, pid:it.profileId, type:'rank', it});
  for(const w of Object.values(S.wants)) if(profile(w.addedBy) && CAT[w.cat]) ev.push({t:w.createdAt||0, pid:w.addedBy, type:'want', w});
  for(const c of Object.values(S.comments)){ const it=S.items[c.itemId]; if(it && profile(c.pid)) ev.push({t:c.at||0, pid:c.pid, type:'comment', it, c}); }
  for(const r of Object.values(S.reacts)){ const it=S.items[r.itemId]; if(it && profile(r.pid) && r.pid!==it.profileId) ev.push({t:r.at||0, pid:r.pid, type:'react', it, r}); }
  return ev.filter(e=>e.t).sort((a,b)=>b.t-a.t);
}
function seenAt(){ try{ return +localStorage.getItem('tummi_seen')||0; }catch(_){ return 0; } }
function setSeen(t){ try{ localStorage.setItem('tummi_seen', String(t)); }catch(_){} }
function unseenCount(){ const since=seenAt(), me=S.activeId; return feedEvents().filter(e=>e.t>since && e.pid!==me && !e.it?.demo && !e.w?.demo && !profile(e.pid)?.demo).length; }
function dayLabel(t){ const d=new Date(t), n=new Date(); const k=x=>x.toDateString(); if(k(d)===k(n)) return 'Today'; const y=new Date(n); y.setDate(n.getDate()-1); if(k(d)===k(y)) return 'Yesterday'; return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}); }

/* ---- where should we eat? ---- */
function pickModel(){
  const who=ui.pickWho; const cats= ui.pickCat==='all'? CATS.map(c=>c.k) : [ui.pickCat];
  const cand=new Map();
  for(const pid of who) for(const cat of cats) for(const r of ranked(pid,cat)){
    const it=r.item; if(ui.pickArea && norm(it.location)!==ui.pickArea) continue;
    const key=norm(it.place)+'|'+norm(it.location);
    if(!cand.has(key)) cand.set(key,{key, place:it.place, location:it.location, cats:new Set(), per:new Map(), best:null});
    const c=cand.get(key); c.cats.add(cat);
    const prev=c.per.get(pid); if(prev==null || r.score>prev) c.per.set(pid, r.score);
    if(!c.best || pid===S.activeId || r.score>c.best.score) c.best={id:it.id, score:r.score, pid};
  }
  const rows=[...cand.values()].map(c=>{ const sc=[...c.per.values()]; const avg=sc.reduce((a,b)=>a+b,0)/sc.length; const min=Math.min(...sc); const tried=c.per.size; const all=tried===who.length;
    return {...c, avg, min, tried, all, value: avg + 0.8*(tried/who.length) + (all&&min>=6.7?0.6:0)}; });
  const hated=rows.filter(r=>r.min<3.4);
  const ok=rows.filter(r=>r.min>=3.4).sort((a,b)=>b.value-a.value);
  const loved=ok.filter(r=>r.all && r.min>=6.7 && who.length>1);
  const rest=ok.filter(r=>!loved.includes(r));
  const wants=wantsFor(ui.pickCat, who).filter(w=>!ui.pickArea || norm(w.location)===ui.pickArea).filter(w=>!cand.has(norm(w.place)+'|'+norm(w.location)))
    .map(w=>({w, n:(w.wantIds||[]).filter(x=>who.includes(x)).length})).sort((a,b)=>b.n-a.n || (b.w.wantIds||[]).length-(a.w.wantIds||[]).length);
  return {who, loved, rest, hated, wants};
}
function pickWhy(r, who){
  if(who.length===1) return `You gave it ${r.avg.toFixed(1)}${r.location?` · ${esc(r.location)}`:''}`;
  const parts=who.map(pid=>{ const p=profile(pid); const v=r.per.get(pid); return v==null? `${esc(p.name)} hasn't been` : `${esc(p.name)} ${v.toFixed(1)}`; });
  return parts.join(' · ')+(r.location?` · ${esc(r.location)}`:'');
}

    ${any?`<button class="btn block primary" style="margin:4px 0 12px" data-a="pick-surprise">🎲 Pick for us</button>`:''}
    ${surprise}

function recapYears(pid){ return [...new Set(Object.values(S.items).filter(i=>i.profileId===pid && i.date).map(i=>+i.date.slice(0,4)))].sort((a,b)=>b-a); }
function recapData(pid, year){
  const mine=Object.values(S.items).filter(i=>i.profileId===pid && (i.date||'').startsWith(String(year)) && CAT[i.cat]);
  const cache={}; const rk=cat=>(cache[cat] ??= ranked(pid,cat));
  const scored=mine.map(it=>({it, r:rk(it.cat).find(x=>x.item.id===it.id)})).filter(x=>x.r);
  const byCat=CATS.map(c=>({c, n:scored.filter(x=>x.it.cat===c.k).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const best=[...scored].sort((a,b)=>b.r.score-a.r.score)[0];
  const tops=byCat.map(({c})=>({c, x:scored.filter(s=>s.it.cat===c.k).sort((a,b)=>a.r.rank-b.r.rank)[0]}));
  const areaCount=new Map(); scored.forEach(x=>{ const k=norm(x.it.location); if(k) areaCount.set(k,{name:x.it.location.trim(), n:(areaCount.get(k)?.n||0)+1}); });
  const topArea=[...areaCount.values()].sort((a,b)=>b.n-a.n)[0];
  const months=new Array(12).fill(0); scored.forEach(x=>{ const m=+x.it.date.slice(5,7)-1; if(m>=0) months[m]++; });
  const busy=months.indexOf(Math.max(...months));
  let twin=null;
  for(const q of S.profiles){ if(q.id===pid) continue; const diffs=[];
    for(const c of CATS){ const a=keyedRanks(pid,c.k), b=keyedRanks(q.id,c.k); for(const [k,r] of a) if(b.has(k)) diffs.push(Math.abs(r.score-b.get(k).score)); }
    if(diffs.length>=2){ const pct=Math.max(0,Math.min(100,Math.round(100-diffs.reduce((s,v)=>s+v,0)/diffs.length*10))); if(!twin || pct>twin.pct) twin={p:q, pct, n:diffs.length}; } }
  let hot=null;
  for(const x of scored){ const others=[]; for(const q of S.profiles){ if(q.id===pid) continue; const k=keyedRanks(q.id,x.it.cat).get(norm(x.it.place)); if(k) others.push(k.score); }
    if(!others.length) continue; const avg=others.reduce((a,b)=>a+b,0)/others.length; const gap=x.r.score-avg;
    if(Math.abs(gap)>=1.5 && (!hot || Math.abs(gap)>Math.abs(hot.gap))) hot={...x, avg, gap}; }
  return {n:scored.length, places:new Set(scored.map(x=>norm(x.it.place))).size, areas:areaCount.size, byCat, best, tops, topArea, busy: scored.length? busy : -1, twin, hot};
}

const BUCKET_HEX={liked:['#2F9A6C','#fff'], fine:['#E6A23C','#2A1C12'], disliked:['#D9573D','#fff']};
async function shareCard({title, subtitle, rows, filename}){
  const W=1080, H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d');
  try{ await Promise.all(['600 80px Outfit','500 40px Outfit','700 40px Figtree','500 30px Figtree'].map(f=>document.fonts.load(f))); }catch(_){}
  const ink='#231811', ink2='#76675A';
  g.fillStyle='#FBF5EA'; g.fillRect(0,0,W,H);
  g.textBaseline='alphabetic';
  g.font='600 60px Outfit, sans-serif'; g.fillStyle=ink; g.fillText('tummi',80,130); const wm=g.measureText('tummi').width; g.fillStyle='#DD5A3E'; g.fillText('.',80+wm,130);
  let fs=78; g.font=`600 ${fs}px Outfit, sans-serif`; while(g.measureText(title).width>920 && fs>44){ fs-=2; g.font=`600 ${fs}px Outfit, sans-serif`; }
  g.fillStyle=ink; g.fillText(title,80,265);
  g.font='500 32px Figtree, sans-serif'; g.fillStyle=ink2; g.fillText(subtitle,80,322);
  const fit=(t,w)=>{ if(g.measureText(t).width<=w) return t; while(t.length>1 && g.measureText(t+'…').width>w) t=t.slice(0,-1); return t+'…'; };
  const rr=(x,y,w,h,r)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); };
  rows.slice(0,6).forEach((r,i)=>{
    const y=380+i*150;
    g.save(); g.shadowColor='rgba(35,24,17,.12)'; g.shadowBlur=24; g.shadowOffsetY=8; g.fillStyle='#FFFDF9'; rr(60,y,960,128,28); g.fill(); g.restore();
    g.fillStyle=r.accent||'#E9DDCB'; rr(60,y,10,128,5); g.fill();
    g.fillStyle=ink; g.font='600 52px Outfit, sans-serif'; g.textAlign='center'; g.fillText(r.lead,135,y+82); g.textAlign='left';
    g.font='700 40px Figtree, sans-serif'; g.fillStyle=ink; g.fillText(fit(r.name,640),195,y+60);
    g.font='500 28px Figtree, sans-serif'; g.fillStyle=ink2; g.fillText(fit(r.sub||'',640),195,y+100);
    if(r.score!=null){ const [bg,fg]=BUCKET_HEX[r.bucket||'liked']; g.fillStyle=bg; g.beginPath(); g.arc(940,y+64,46,0,Math.PI*2); g.fill(); g.fillStyle=fg; g.font='600 38px Outfit, sans-serif'; g.textAlign='center'; g.fillText(r.score.toFixed(1),940,y+78); g.textAlign='left'; }
  });
  g.font='500 28px Figtree, sans-serif'; g.fillStyle=ink2; g.fillText('Ranked on Tummi · '+location.host+location.pathname.replace(/index\.html$/,'').replace(/\/$/,''),80,H-60);
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  const file=new File([blob], filename, {type:'image/png'});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
  toast('Image saved');
}

function flowCompare(){
  const it=flow.item; const L=flow.list; const other=S.items[L[flow.mid]];
  const rows=ranked(it.profileId,it.cat); const orow=rows.find(r=>r.item.id===other.id);

    ${rows.length<MIN_FOR_STABLE?`<p class="muted" style="margin:6px 0 0;font-size:14px;max-width:30ch">Rank ${MIN_FOR_STABLE-rows.length} more to settle the scale.</p>`:''}
