function sheetFlow(){
  if(!flow) return '';
  const body={details:flowDetails, bucket:flowBucket, compare:flowCompare, result:flowResult}[flow.step]();
  return `<div class="panel full" role="dialog" aria-label="Rank">${body}</div>`;
}
function chooseBucket(k){
  const it=flow.item; flow.bucket=k;
  flow.list=catOrder(it.profileId,it.cat)[k].filter(id=>id!==it.id && S.items[id]);
  flow.lo=0; flow.hi=flow.list.length; flow.history=[]; flow.count=0; flow.step='compare';
  nextCompare();
}
function nextCompare(){
  if(flow.lo>=flow.hi){ finalize(flow.lo, null); return; }
  flow.mid=Math.floor((flow.lo+flow.hi)/2); flow.count++;
  renderSheet();
}
function choose(res){
  const L=flow.list, mid=flow.mid;
  if(res==='tie'){ finalize(null, L[mid]); return; }
  if(res==='skip'){ finalize(mid, null); return; }
  flow.history.push({lo:flow.lo, hi:flow.hi});
  const g=S.items[L[mid]].tie; let s=mid, e=mid;
  if(g){ while(s-1>=flow.lo && S.items[L[s-1]].tie===g) s--; while(e+1<flow.hi && S.items[L[e+1]].tie===g) e++; }
  if(res==='new') flow.hi=s; else flow.lo=e+1;
  nextCompare();
}
function undoCompare(){
  if(!flow.history.length){ flow.step='bucket'; renderSheet(); return; }
  const h=flow.history.pop(); flow.lo=h.lo; flow.hi=h.hi; flow.count=Math.max(0,flow.count-2); nextCompare();
}
function finalize(pos, tieWithId){
  const it=flow.item; const changed=[it.id];
  if(S.items[it.id]) changed.push(...removeFromOrder(S.items[it.id]));
  it.tie=null;
  S.items[it.id]=it;
  const o=catOrder(it.profileId,it.cat);
  o[flow.bucket]=o[flow.bucket].filter(id=>id!==it.id && S.items[id]);
  const arr=o[flow.bucket];
  if(tieWithId){
    const other=S.items[tieWithId]; const g=other.tie || ('t'+uid());
    if(!other.tie){ other.tie=g; changed.push(other.id); }
    it.tie=g;
    let idx=arr.indexOf(tieWithId); while(idx+1<arr.length && S.items[arr[idx+1]].tie===g) idx++;
    arr.splice(idx+1,0,it.id);
  } else {
    let p=Math.max(0,Math.min(pos,arr.length));
    while(p>0 && p<arr.length && S.items[arr[p-1]].tie && S.items[arr[p-1]].tie===S.items[arr[p]].tie) p++;
    arr.splice(p,0,it.id);
  }
  if(flow.fromWant && S.wants[flow.fromWant]){ const w=S.wants[flow.fromWant]; w.wantIds=(w.wantIds||[]).filter(x=>x!==it.profileId); if(!w.wantIds.length) delete S.wants[w.id]; flow.fromWant=null; }
  commit({items:[...new Set(changed)]});
  ui.mapFit=true;
  flow.resultId=it.id; flow.step='result';
  render();
}

/* ---- address search (OpenStreetMap Nominatim, hosted version only) ---- */
function areaOf(a){ return a? (a.city||a.town||a.village||a.suburb||a.hamlet||a.county||'') : ''; }
function shortAddr(a,full){ if(!a) return full||''; const street=[a.house_number,a.road].filter(Boolean).join(' '); return [street, areaOf(a), a.state].filter(Boolean).join(', ') || full; }
async function geoSearch(){
  const it=flow.item;
  if(!it.place.trim()){ flow.geoMsg='Type the place name first.'; renderSheet(); return; }
  flow.geoMsg='Searching…'; flow.geoResults=[]; renderSheet();
  const q=[it.place.trim(), it.location.trim()].filter(Boolean).join(', ');
  let url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=us&q=${encodeURIComponent(q)}`;
  if(flow.here){ const {lat,lng}=flow.here; url+=`&viewbox=${lng-.1},${lat+.1},${lng+.1},${lat-.1}`; }
  try{
    const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok) throw 0;
    const j=await r.json();
    if(!flow) return; syncForm();
    flow.geoResults=j.map(x=>({name:x.name||x.display_name.split(',')[0], addr:shortAddr(x.address,x.display_name), lat:+x.lat, lng:+x.lon, area:areaOf(x.address)}));
    flow.geoMsg= j.length? 'Tap the right one:' : (it.location? 'No match. Try "I\'m here now" while you\'re at the place.' : 'No match. Add the city in Location and try again.');
  }catch(e){ if(!flow) return; syncForm(); flow.geoMsg="Search isn't working right now. Try again in a moment."; }
  renderSheet();
}
function geoHere(){
  if(!navigator.geolocation){ flow.geoMsg='Location isn\'t available in this browser.'; renderSheet(); return; }
  flow.geoMsg='Finding you…'; renderSheet();
  navigator.geolocation.getCurrentPosition(async pos=>{
    if(!flow) return; syncForm();
    const lat=+pos.coords.latitude.toFixed(5), lng=+pos.coords.longitude.toFixed(5);
    flow.here={lat,lng}; Object.assign(flow.item,{lat,lng,address:'Where you were'});
    flow.geoMsg='Pinned to where you are.';
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=17&lat=${lat}&lon=${lng}`); const j=await r.json();
      if(!flow) return; syncForm();
      flow.item.address=shortAddr(j.address,j.display_name)||'Where you were';
      if(!flow.item.location.trim()) flow.item.location=areaOf(j.address);
    }catch(e){}
    renderSheet();
    if(flow.item.place.trim()) geoSearch(); // suggest the restaurant itself, biased to here
    else nearbyPlaces(lat,lng);
  }, ()=>{ if(!flow) return; syncForm(); flow.geoMsg='Location permission was denied. Turn it on in your browser settings, or use Find this place.'; renderSheet(); }, {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
}

/* ---- type-ahead for Location (towns and cities) and Place (restaurants) ----
   Photon (photon.komoot.io) is a free OpenStreetMap search built for as-you-type lookups.
   Overpass lists named food spots around you for "I'm here now". Hosted version only. */
const PHOTON='https://photon.komoot.io/api/';
const FOOD_TAGS=['restaurant','fast_food','cafe','bar','pub','food_court','biergarten'];
const ac={place:{list:[], seq:0, timer:null}, loc:{list:[], seq:0, timer:null}};
function photonPlace(f){
  const p=f.properties||{}; const [lng,lat]=f.geometry?.coordinates||[];
  const street=[p.housenumber,p.street].filter(Boolean).join(' ');
  const city=p.city||p.town||p.village||p.district||p.locality||(p.type==='city'?p.name:'')||'';
  return {p, lat:+(+lat).toFixed(5), lng:+(+lng).toFixed(5), street, city, state:p.state||'', country:p.countrycode||''};
}
function acCenter(){
  if(!flow) return null;
  if(flow.locGeo) return flow.locGeo;
  if(flow?.here) return flow.here;
  if(hasPin(flow.item)) return {lat:flow.item.lat, lng:flow.item.lng};
  const last=Object.values(S.items).filter(hasPin).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  return last? {lat:last.lat, lng:last.lng} : null;
}
function acPast(kind, q){
  const n=norm(q);
  const all = kind==='loc' ? [...areaNames(Object.values(S.items)).values()]
    : [...new Map(Object.values(S.items).map(i=>[norm(i.place), i])).values()];
  return all.filter(x=>{ const name=kind==='loc'?x:x.place; return !n || norm(name).includes(n); }).slice(0, n?4:5)
    .map(x=> kind==='loc' ? {kind:'past', name:x, sub:'Used before'} : {kind:'past', name:x.place, sub:[x.address||x.location, 'You ranked here'].filter(Boolean).join(' · '), item:x});
}
function acRender(kind, msg){
  const box=document.getElementById('ac-'+kind); if(!box) return;
  const list=ac[kind].list;
  if(!list.length && !msg){ box.classList.remove('open'); box.innerHTML=''; return; }
  box.innerHTML=list.map((r,i)=>`<button type="button" role="option" data-a="ac-pick" data-k="${kind}" data-i="${i}"><span><b>${esc(r.name)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:''}</span>${r.tag?`<i>${esc(r.tag)}</i>`:''}</button>`).join('')+(msg?`<div class="ac-msg">${esc(msg)}</div>`:'');
  box.classList.add('open');
}
function acInput(kind, typed){
  const el=document.getElementById(kind==='loc'?'f-loc':'f-place'); if(!el || !flow) return;
  const q=el.value.trim(); const st=ac[kind];
  if(kind==='loc' && typed) flow.locGeo=null;
  st.list=acPast(kind,q); acRender(kind);
  clearTimeout(st.timer);
  if(IN_CLAUDE || q.length<2) return;
  st.timer=setTimeout(()=>acFetch(kind,q), 280);
}
async function acFetch(kind, q){
  if(!flow) return;
  const st=ac[kind]; const seq=++st.seq;
  const params=new URLSearchParams({q, limit: kind==='loc'?'8':'10', lang:'en'});
  const c=acCenter();
  if(kind==='loc'){ ['city','town','village','suburb','neighbourhood','quarter','hamlet'].forEach(v=>params.append('osm_tag','place:'+v)); }
  else { FOOD_TAGS.forEach(v=>params.append('osm_tag','amenity:'+v)); }
  if(c){ params.set('lat',c.lat); params.set('lon',c.lng); params.set('location_bias_scale', kind==='loc'?'0.3':'0.6'); params.set('zoom', kind==='loc'?'8':'12'); }
  if(kind==='place' && flow.locGeo){ const {lat,lng}=flow.locGeo; params.set('bbox',[lng-.35,lat-.25,lng+.35,lat+.25].join(',')); }
  try{
    const r=await fetch(PHOTON+'?'+params, {headers:{Accept:'application/json'}}); if(!r.ok) throw 0;
    const j=await r.json(); if(seq!==st.seq || !flow) return;
    const seen=new Set(st.list.map(x=>norm(x.name)+'|'+norm(x.sub)));
    let rows=(j.features||[]).map(photonPlace).filter(x=>x.p.name).map(x=>{
      if(kind==='loc'){ const sub=[x.p.county&&x.p.county!==x.p.name?x.p.county:'', x.state, x.country&&x.country!=='US'?x.country:''].filter(Boolean).join(', ');
        return {kind:'geo', name:x.p.name, sub, lat:x.lat, lng:x.lng, us:x.country==='US'}; }
      const sub=[x.street, x.city, x.state].filter(Boolean).join(', ');
      const tag={fast_food:'Fast food', cafe:'Cafe', bar:'Bar', pub:'Pub', food_court:'Food court', biergarten:'Beer garden'}[x.p.osm_value]||'';
      return {kind:'geo', name:x.p.name, sub, tag, lat:x.lat, lng:x.lng, city:x.city, addr:[x.street, x.city, x.state].filter(Boolean).join(', '), us:x.country==='US'};
    });
    if(kind==='loc') rows.sort((a,b)=>(b.us?1:0)-(a.us?1:0));
    rows=rows.filter(x=>{ const k=norm(x.name)+'|'+norm(x.sub); if(seen.has(k)) return false; seen.add(k); return true; });
    st.list=[...st.list, ...rows].slice(0,10);
    const el=document.getElementById(kind==='loc'?'f-loc':'f-place');
    if(document.activeElement===el) acRender(kind, st.list.length?'':(kind==='place'?'No restaurants found. Keep typing, or set the Location first.':'No towns found.'));
  }catch(e){ if(seq===st.seq) acRender(kind, st.list.length?'':"Search isn't reachable right now. You can still type it in."); }
}
function acPick(kind, i){
  const r=ac[kind].list[i]; if(!r || !flow) return;
  const it=flow.item;
  if(kind==='loc'){ it.location=r.name; if(r.lat!=null) flow.locGeo={lat:r.lat, lng:r.lng}; }
  else {
    it.place=r.name;
    if(r.kind==='geo'){ Object.assign(it,{lat:r.lat, lng:r.lng, address:r.addr||r.name}); if(!it.location.trim() && r.city) it.location=r.city; flow.geoMsg=''; flow.geoResults=[]; }
    else if(r.item){ if(!hasPin(it) && hasPin(r.item)) Object.assign(it,{lat:r.item.lat, lng:r.item.lng, address:r.item.address}); if(!it.location.trim() && r.item.location) it.location=r.item.location; }
  }
  ac[kind].list=[]; renderSheet();
  if(kind==='loc') setTimeout(()=>{ const el=$('#f-place'); if(el && !el.value) el.focus(); },50);
}
async function nearbyPlaces(lat,lng){
  const q=`[out:json][timeout:15];nwr(around:350,${lat},${lng})["amenity"~"^(${FOOD_TAGS.join('|')})$"]["name"];out center 40;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST', body:'data='+encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}}); if(!r.ok) throw 0;
    const j=await r.json(); if(!flow) return;
    const d2=(a,b)=>{ const x=(b.lng-a.lng)*Math.cos(a.lat*Math.PI/180), y=b.lat-a.lat; return x*x+y*y; };
    const rows=(j.elements||[]).map(e=>{ const t=e.tags||{}; const la=e.lat??e.center?.lat, lo=e.lon??e.center?.lon;
      const street=[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' ');
      return {name:t.name, lat:+(+la).toFixed(5), lng:+(+lo).toFixed(5), addr:[street, t['addr:city']].filter(Boolean).join(', ')||'Near you', area:t['addr:city']||'', setName:true}; })
      .filter(x=>x.name && !isNaN(x.lat)).sort((a,b)=>d2({lat,lng},a)-d2({lat,lng},b)).slice(0,8);
    if(!rows.length) return;
    syncForm(); flow.geoResults=rows; flow.geoMsg='Pinned to where you are. Eating at one of these?'; renderSheet();
  }catch(e){}
}
document.addEventListener('input', e=>{ const k=e.target.dataset?.ac; if(k) acInput(k, true); if(e.target.id==='c-text' && ui.sheet) ui.sheet.draft=e.target.value; });
document.addEventListener('focusin', e=>{ const k=e.target.dataset?.ac; if(k) acInput(k); });
document.addEventListener('focusout', e=>{ const k=e.target.dataset?.ac; if(k) setTimeout(()=>{ const el=document.getElementById(k==='loc'?'f-loc':'f-place'); if(el && document.activeElement!==el){ ac[k].list=[]; acRender(k); } },250); });
document.addEventListener('keydown', e=>{ const k=e.target.dataset?.ac; if(k && e.key==='Enter' && ac[k].list.length){ e.preventDefault(); syncForm(); acPick(k,0); } });

/* ============ render ============ */
function renderSheet(){
  const el=$('#sheet');
  if(!ui.sheet){ el.className=''; el.innerHTML=''; document.body.classList.remove('locked'); return; }
  const builders={news:sheetNews, crew:sheetCrew, want:sheetWant, cat:sheetCat, recap:sheetRecap, switcher:sheetSwitcher, profile:sheetProfile, info:sheetInfo, item:sheetItem, flow:sheetFlow};
  const inner=builders[ui.sheet.type]();
  if(!ui.sheet){ renderSheet(); return; }
  const prevSc = el.querySelector('.sheet-body, .panel:not(.full)');
  const kind=ui.sheet.type+(flow?.step||'');
  const top = prevSc && el.dataset.kind===kind ? prevSc.scrollTop : 0;
  el.dataset.kind=kind;
  el.innerHTML=`${ui.sheet.type==='flow'?'':'<div class="backdrop" data-a="close"></div>'}${inner}`;
  el.className='open'; document.body.classList.add('locked');
  const sc=el.querySelector('.sheet-body, .panel:not(.full)'); if(sc && top) sc.scrollTop=top;
}
function renderMain(){
  ensureS(); rebuildCats();
  if(!profile(S.activeId)) S.activeId=S.profiles[0].id;
  if(!CAT[ui.cat]) ui.cat=CATS[0].k; if(!CAT[ui.cmpCat]) ui.cmpCat=CATS[0].k; if(!CAT[ui.groupCat]) ui.groupCat=CATS[0].k;
  if(ui.areaCat!=='all' && !CAT[ui.areaCat]) ui.areaCat='all'; if(ui.mapCat!=='all' && !CAT[ui.mapCat]) ui.mapCat='all'; if(ui.pickCat!=='all' && !CAT[ui.pickCat]) ui.pickCat='all';
  if(lmap && ui.tab!=='map'){ lmap.remove(); lmap=null; }
  $('#app').innerHTML = header() + `<main>${VIEWS[ui.tab]()}</main>` + tabbar();
  if(ui.tab==='map' && !IN_CLAUDE) mountMap();
  if(ui.flash){ const id=ui.flash; setTimeout(()=>{ if(ui.flash===id) ui.flash=null; },1500); }
}
function render(){ renderMain(); renderSheet(); }
function closeSheet(){ ui.sheet=null; flow=null; render(); }

/* ============ photo ============ */
function resizeImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=720; const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        let q=.8, url=c.toDataURL('image/jpeg',q); while(url.length>170000 && q>.35){ q-=.1; url=c.toDataURL('image/jpeg',q); }
        res(url); };
      img.onerror=()=>rej(new Error('image')); img.src=fr.result; };
    fr.onerror=()=>rej(new Error('read')); fr.readAsDataURL(file);
  });
}

/* ============ events ============ */
document.addEventListener('change', async e=>{
  const el=e.target; const kind=el.dataset.change;
  if(kind==='photo' && el.files && el.files[0]){
    syncForm();
    try{ flow.item.photo=await resizeImage(el.files[0]); }catch(_){ toast("That photo couldn't be read. Try a JPG or PNG."); }
    renderSheet();
  }
  if(kind==='area'){ ui.area=el.value; ui.style='all'; renderMain(); }
  if(kind==='pick-area'){ ui.pickArea=el.value; ui.pickSurprise=null; renderMain(); }
  if(kind==='import' && el.files && el.files[0]) importBackup(el.files[0]);
});
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a; const d=t.dataset;
  syncForm();
  if(a!=='reset') ui.armReset=false;
  switch(a){
    case 'tab': if(ui.tab!==d.tab) ui.feedSeen=null; ui.tab=d.tab; window.scrollTo(0,0); render(); break;
    case 'set-cat': ui.cat=d.cat; ui.style='all'; renderMain(); break;
    case 'style': ui.style=d.v; renderMain(); break;
    case 'clear-area': ui.area=''; renderMain(); break;
    case 'area-scope': ui.areaScope=d.v; renderMain(); break;
    case 'area-cat': ui.areaCat=d.cat; renderMain(); break;
    case 'area-min': ui.areaMin=d.v==='1'; renderMain(); break;
    case 'open-area':
      if(ui.areaScope==='all'){ ui.crew='board'; }
      ui.area=d.k; ui.style='all'; if(ui.areaCat!=='all') ui.cat=ui.areaCat;
      else { const p=activeProfile(); const best=CATS.map(c=>[c.k, ranked(p.id,c.k).filter(r=>norm(r.item.location)===d.k).length]).sort((x,y)=>y[1]-x[1])[0]; if(best && best[1]) ui.cat=best[0]; }
      ui.tab='lists'; window.scrollTo(0,0); render(); break;
    case 'map-scope': ui.mapScope=d.v; ui.mapFit=true; renderMain(); break;
    case 'map-cat': ui.mapCat=d.cat; ui.mapFit=true; renderMain(); break;
    case 'locate': locateMe(); break;
    case 'show-on-map': ui.mapFocus=d.id; ui.mapScope= S.items[d.id].profileId===S.activeId ? 'me' : 'all'; ui.mapCat='all'; ui.sheet=null; ui.tab='map'; window.scrollTo(0,0); render(); break;
    case 'crew': if(ui.crew!==d.v || ui.tab!=='crew') ui.feedSeen=null; ui.crew=d.v; ui.tab='crew'; window.scrollTo(0,0); renderMain(); break;
    // where to eat
    case 'pick-who': { const w=ui.pickWho||[S.activeId]; const i=w.indexOf(d.id); if(i>=0){ if(w.length>1) w.splice(i,1); } else w.push(d.id); ui.pickWho=w; ui.pickSurprise=null; renderMain(); } break;
    case 'pick-all': ui.pickWho=S.profiles.map(p=>p.id); ui.pickSurprise=null; renderMain(); break;
    case 'pick-cat': ui.pickCat=d.cat; ui.pickSurprise=null; renderMain(); break;
    case 'pick-surprise': { const m=pickModel(); const pool=[...m.loved.slice(0,4), ...m.rest.slice(0,4)].map(r=>({kind:'place', key:r.key})).concat(m.wants.slice(0,3).map(x=>({kind:'want', id:x.w.id})));
      const prev=ui.pickSurprise; const opts=pool.length>1? pool.filter(x=>!prev || (x.key||x.id)!==(prev.key||prev.id)) : pool;
      ui.pickSurprise=opts[Math.floor(Math.random()*opts.length)]||null; renderMain(); setTimeout(()=>document.querySelector('.pick-card')?.scrollIntoView({block:'center',behavior:'smooth'}),30); } break;
    // year in review + sharing
    case 'recap-open': ui.recapYear=null; ui.sheet={type:'recap'}; renderSheet(); break;
    case 'recap-year': ui.recapYear=+d.v; renderSheet(); break;
    case 'recap-share': shareRecap().catch(()=>toast("Couldn't make the image.")); break;
    case 'share-top': shareTop().catch(()=>toast("Couldn't make the image.")); break;
    case 'map-wants': ui.mapWants=!ui.mapWants; renderMain(); break;
    // custom categories
    case 'cat-new': ui.sheet={type:'cat', k:null, draft:{name:'', one:'', emoji:CAT_EMOJI[0], color:P_COLORS[(CATS.length)%P_COLORS.length], styles:''}}; renderSheet(); setTimeout(()=>$('#cat-name')?.focus(),260); break;
    case 'cat-edit': { const c=S.cats[d.k]; if(!c) break; ui.sheet={type:'cat', k:c.k, draft:{name:c.name, one:c.one||'', emoji:c.emoji, color:c.color, styles:(c.styles||[]).join(', ')}}; renderSheet(); } break;
    case 'cat-emoji': catDraftSync(); ui.sheet.draft.emoji=d.v; renderSheet(); break;
    case 'cat-color': catDraftSync(); ui.sheet.draft.color=d.v; renderSheet(); break;
    case 'cat-save': { catDraftSync(); const sh=ui.sheet, dr=sh.draft; const name=dr.name.trim();
      if(!name){ sh.error='Give the category a name.'; renderSheet(); break; }
      if(CATS.some(c=>c.k!==sh.k && norm(c.name)===norm(name))){ sh.error='There is already a category with that name.'; renderSheet(); break; }
      const k=sh.k||('c_'+uid()); const prev=S.cats[k]||{createdAt:Date.now()};
      S.cats[k]={...prev, k, name, one:dr.one.trim()||name.toLowerCase(), emoji:dr.emoji, color:dr.color, styles:dr.styles.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12)};
      rebuildCats(); commit(); ui.cat=k; ui.sheet=null; ui.tab='lists'; render(); toast(sh.k?'Category saved':`${name} added`); } break;
    case 'cat-del': { const sh=ui.sheet; if(Object.values(S.items).some(i=>i.cat===sh.k)) break;
      if(!sh.armDel){ catDraftSync(); sh.armDel=true; renderSheet(); break; }
      delete S.cats[sh.k]; for(const w of Object.values(S.wants)) if(w.cat===sh.k) delete S.wants[w.id];
      rebuildCats(); ui.cat=CATS[0].k; commit(); ui.sheet=null; render(); toast('Category deleted'); } break;
    // want to try
    case 'want-new': startFlow('want',{cat:d.cat||ui.cat}); break;
    case 'open-want': if(lmap) lmap.closePopup(); ui.sheet={type:'want', id:d.id}; renderSheet(); break;
    case 'want-me': { const w=S.wants[d.id]; if(!w) break; const ids=w.wantIds||[]; const i=ids.indexOf(S.activeId); i>=0?ids.splice(i,1):ids.push(S.activeId); w.wantIds=ids; commit(); render(); toast(i>=0?'Taken off your list':'Added to your list'); } break;
    case 'want-rank': { const w=S.wants[d.id]; if(!w) break; startFlow('new',{cat:w.cat, fromWant:w.id, prefill:{place:w.place, location:w.location||'', address:w.address||'', lat:w.lat??null, lng:w.lng??null}}); } break;
    case 'want-map': ui.mapFocus='want:'+d.id; ui.mapWants=true; ui.mapScope='all'; ui.mapCat='all'; ui.sheet=null; ui.tab='map'; window.scrollTo(0,0); render(); break;
    case 'want-del': if(!ui.sheet.armDel){ ui.sheet.armDel=true; renderSheet(); break; } delete S.wants[d.id]; commit(); ui.sheet=null; render(); toast('Removed'); break;
    case 'want-save': {
      const it=flow.item; it.place=it.place.trim(); it.location=it.location.trim();
      const known=areaNames(Object.values(S.items)); if(known.has(norm(it.location))) it.location=known.get(norm(it.location));
      if(!it.place){ flow.error='Add the place name.'; renderSheet(); $('.sheet-body').scrollTop=0; break; }
      const me=S.activeId;
      const dup=Object.values(S.wants).find(w=>w.cat===it.cat && norm(w.place)===norm(it.place));
      if(dup){ if(!(dup.wantIds||[]).includes(me)) dup.wantIds=[...(dup.wantIds||[]), me]; commit(); closeSheet(); toast(`${dup.place} was already on the list. Added you.`); break; }
      const id='w_'+uid();
      S.wants[id]={id, cat:it.cat, place:it.place, location:it.location, address:it.address||'', lat:it.lat, lng:it.lng, notes:(it.notes||'').trim(), addedBy:me, wantIds:[me], createdAt:Date.now()};
      commit(); ui.cat=it.cat; ui.tab='lists'; closeSheet(); toast('Saved to want-to-try'); } break;
    // reactions & comments
    case 'react': { const me=S.activeId; const key=d.id+'__'+me; const cur=S.reacts[key];
      if(cur && cur.e===d.v) delete S.reacts[key]; else S.reacts[key]={itemId:d.id, pid:me, e:d.v, at:Date.now()};
      commit(); renderSheet(); } break;
    case 'comment-send': { const el=$('#c-text'); const text=(el?.value||'').trim(); if(!text) break;
      const id='c_'+uid(); S.comments[id]={id, itemId:d.id, pid:S.activeId, text:text.slice(0,400), at:Date.now()}; ui.sheet.draft='';
      commit(); renderSheet(); setTimeout(()=>{ const b=document.querySelector('.panel'); if(b) b.scrollTop=b.scrollHeight; },30); } break;
    case 'comment-del': delete S.comments[d.id]; commit(); renderSheet(); break;
    case 'news-all': ui.sheet={type:'news', since:null}; renderSheet(); break;
    case 'install-hide': try{ localStorage.setItem('tummi_install_hide','1'); }catch(_){} renderMain(); break;
    case 'cmp-cat': ui.cmpCat=d.cat; renderMain(); break;
    case 'group-cat': ui.groupCat=d.cat; renderMain(); break;
    case 'gmin': ui.groupMin2=d.v==='1'; renderMain(); break;
    case 'cmp-a': ui.cmpA=d.id; if(ui.cmpB===d.id) ui.cmpB=null; renderMain(); break;
    case 'cmp-b': if(d.id!==ui.cmpA){ ui.cmpB=d.id; renderMain(); } break;
    case 'switcher': ui.sheet={type:'switcher'}; renderSheet(); break;
    case 'manage': ui.sheet=null; ui.tab='crew'; ui.crew='profiles'; render(); break;
    case 'switch': S.activeId=d.id; ui.cmpA=d.id; ui.area=''; ui.mapFit=true; commit(); ui.sheet=null; render(); toast(`Ranking as ${profile(d.id).name}`); break;
    case 'close': if(ui.sheet?.type==='crew' && ui.sheet.first){ try{ localStorage.setItem('tummi_crew_skip','1'); }catch(_){} } closeSheet(); break;
    case 'crew-open': ui.sheet={type:'crew', mode:'join'}; renderSheet(); break;
    case 'crew-mode': { const sh=ui.sheet; sh.code=$('#cr-code').value; sh.pass=$('#cr-pass').value; sh.bring=$('#cr-bring')?$('#cr-bring').checked:sh.bring; sh.mode=d.v; sh.error=''; renderSheet(); } break;
    case 'crew-go': {
      const sh=ui.sheet; if(sh.busy) break;
      sh.code=$('#cr-code').value.trim(); sh.pass=$('#cr-pass').value; sh.bring=$('#cr-bring')?$('#cr-bring').checked:false;
      if(sh.code.length<3){ sh.error='Crew name needs at least 3 characters.'; renderSheet(); break; }
      if(sh.mode==='create' && sh.pass.length<6){ sh.error='Passcode needs at least 6 characters.'; renderSheet(); break; }
      if(!sh.pass){ sh.error='Enter the passcode.'; renderSheet(); break; }
      sh.busy=true; sh.error=''; renderSheet();
      joinCrew(sh.code, sh.pass, sh.mode==='create', sh.bring).then(r=>{
        ui.tab='lists'; ui.area=''; ui.mapFit=true;
        if(r.fresh){ const p=S.profiles[0]; ui.sheet={type:'profile', id:p.id, draft:{name:p.name, color:p.color}}; render(); toast('Crew started. Check your name.'); }
        else if(!r.picked){ ui.sheet={type:'switcher'}; render(); toast("You're in. Pick yourself, or tap Add a friend to add you."); }
        else { ui.sheet=null; render(); toast("You're in the crew"); }
      }).catch(e=>{ sh.busy=false;
        sh.error = e.offline ? "Can't reach the crew server. Check your connection." : e.code==='badpass' ? 'Wrong crew name or passcode.' : e.code==='taken' ? 'That crew name is taken. Pick another, or switch to Join.' : e.message;
        if(ui.sheet===sh) renderSheet(); });
    } break;
    case 'crew-sync': syncNow(); toast('Syncing…'); break;
    case 'crew-leave':
      if(!ui.armLeave){ ui.armLeave=true; toast('Tap Leave crew again to disconnect this phone. It keeps a copy.'); setTimeout(()=>{ ui.armLeave=false; },4000); break; }
      ui.armLeave=false; leaveCrew(); renderMain(); toast('Left the crew. This phone kept a copy.'); break;
    case 'info': ui.sheet={type:'info'}; renderSheet(); break;
    case 'export': exportBackup(); break;
    case 'demo': buildDemo(); ui.mapFit=true; commit({items:Object.keys(S.items)}); render(); toast('Sample data loaded'); break;
    case 'clear-demo': clearDemo(); render(); break;
    case 'reset':
      if(!ui.armReset){ ui.armReset=true; renderMain(); break; }
      { const del=Object.keys(S.items); const keep=activeProfile(); S={profiles:[{...keep, demo:false}], activeId:keep.id, orders:{}, items:{}, wants:{}, reacts:{}, comments:{}, cats:{}}; rebuildCats(); ui.armReset=false; ui.area=''; commit({del}); render(); toast('Everything erased'); }
      break;
    // profiles
    case 'new-profile': ui.sheet={type:'profile', id:null, draft:{name:'', color:P_COLORS[S.profiles.length%P_COLORS.length]}}; renderSheet(); setTimeout(()=>$('#pf-name')?.focus(),260); break;
    case 'edit-profile': { const p=profile(d.id); ui.sheet={type:'profile', id:p.id, draft:{name:p.name, color:p.color}}; renderSheet(); } break;
    case 'pf-color': ui.sheet.draft.name=$('#pf-name').value; ui.sheet.draft.color=d.v; renderSheet(); break;
    case 'pf-emoji': ui.sheet.draft.name=$('#pf-name').value; ui.sheet.draft.emoji=d.v; renderSheet(); break;
    case 'pf-save': {
      const sh=ui.sheet; sh.draft.name=$('#pf-name').value.trim();
      if(!sh.draft.name){ sh.error='Give this profile a name.'; renderSheet(); break; }
      if(S.profiles.some(p=>p.id!==sh.id && norm(p.name)===norm(sh.draft.name))){ sh.error='There is already a profile with that name.'; renderSheet(); break; }
      if(sh.id){ Object.assign(profile(sh.id), sh.draft, {demo:false}); }
      else { S.profiles.push({id:'p_'+uid(), ...sh.draft}); }
      commit(); ui.sheet=null; render(); toast(sh.id?'Profile saved':`${sh.draft.name} added`);
    } break;
    case 'pf-del': {
      const sh=ui.sheet; if(!sh.armDel){ sh.armDel=true; sh.draft.name=$('#pf-name').value; renderSheet(); break; }
      const del=Object.values(S.items).filter(i=>i.profileId===sh.id).map(i=>i.id);
      del.forEach(id=>delete S.items[id]); delete S.orders[sh.id];
      Object.values(S.items).forEach(i=>{ if(i.withIds) i.withIds=i.withIds.filter(x=>x!==sh.id); });
      S.profiles=S.profiles.filter(p=>p.id!==sh.id); if(S.activeId===sh.id) S.activeId=S.profiles[0].id;
      commit({del}); ui.sheet=null; render(); toast('Profile deleted');
    } break;
    // items
    case 'open-item': ui.sheet={type:'item', id:d.id}; renderSheet(); break;
    case 'del-item': {
      if(!ui.sheet.armDel){ ui.sheet.armDel=true; renderSheet(); break; }
      const it=S.items[d.id]; const changed=removeFromOrder(it); delete S.items[d.id];
      commit({items:changed, del:[d.id]}); ui.sheet=null; ui.mapFit=true; render(); toast('Deleted');
    } break;
    case 'edit-item': startFlow('edit',{id:d.id}); break;
    case 'rerank': startFlow('rerank',{id:d.id}); break;
    case 'add': startFlow('new',{cat:d.cat}); break;
    // flow
    case 'flow-close': closeSheet(); break;
    case 'f-cat': flow.item.cat=d.cat; flow.item.style=''; renderSheet(); break;
    case 'f-style': flow.item.style= flow.item.style===d.v ? '' : d.v; renderSheet(); break;
    case 'f-with': { const w=flow.item.withIds; const i=w.indexOf(d.id); i>=0?w.splice(i,1):w.push(d.id); renderSheet(); } break;
    case 'f-nophoto': flow.item.photo=null; renderSheet(); break;
    case 'geo-search': geoSearch(); break;
    case 'geo-here': geoHere(); break;
    case 'geo-pick': { const g=flow.geoResults[+d.i]; Object.assign(flow.item,{lat:g.lat, lng:g.lng, address:g.addr}); if(g.setName) flow.item.place=g.name; if(!flow.item.location.trim() && g.area) flow.item.location=g.area; flow.geoResults=[]; flow.geoMsg=''; renderSheet(); } break;
    case 'ac-pick': acPick(d.k, +d.i); break;
    case 'geo-clear': Object.assign(flow.item,{lat:null,lng:null,address:''}); renderSheet(); break;
    case 'flow-next': case 'flow-save': {
      const it=flow.item; it.place=it.place.trim(); it.dish=it.dish.trim(); it.style=it.style.trim(); it.location=it.location.trim();
      // reuse the existing spelling of an area so "royal oak" and "Royal Oak" group together
      const known=areaNames(Object.values(S.items).filter(i=>i.id!==it.id)); if(known.has(norm(it.location))) it.location=known.get(norm(it.location));
      flow.error=null; flow.dupId=null;
      if(!it.place){ flow.error='Add the place name so you can find it later.'; renderSheet(); $('.sheet-body').scrollTop=0; break; }
      const dup=Object.values(S.items).find(i=>i.id!==it.id && i.profileId===it.profileId && i.cat===it.cat && norm(i.place)===norm(it.place) && norm(i.dish)===norm(it.dish));
      if(dup){ flow.error=`${esc(profile(it.profileId).name)} already ranked ${dup.dish?esc(dup.dish)+' at ':''}${esc(dup.place)}. Add a dish name to tell them apart.`; flow.dupId=dup.id; renderSheet(); $('.sheet-body').scrollTop=0; break; }
      if(a==='flow-save'){ S.items[it.id]=it; commit({items:[it.id]}); ui.mapFit=true; ui.sheet={type:'item', id:it.id}; flow=null; render(); toast('Saved'); break; }
      flow.step='bucket'; renderSheet();
    } break;
    case 'flow-back': flow.step='details'; renderSheet(); break;
    case 'bucket': chooseBucket(d.v); break;
    case 'choose': choose(d.r); break;
    case 'cmp-undo': undoCompare(); break;
    case 'flow-done': { const it=S.items[flow.resultId]; ui.tab='lists'; ui.cat=it.cat; ui.style='all'; if(ui.area && norm(it.location)!==ui.area) ui.area=''; ui.flash=it.id; S.activeId=it.profileId; closeSheet(); setTimeout(()=>document.querySelector('.row.flash')?.scrollIntoView({block:'center',behavior:'smooth'}),50); } break;
    case 'flow-another': { const cat=flow.item.cat; ui.cat=cat; flow=null; startFlow('new',{cat}); } break;
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ui.sheet && !(ui.sheet.type==='flow' && flow?.step==='compare')) closeSheet(); });

/* ============ boot ============ */
(async function boot(){
  const loaded=await loadLocal();
  if(loaded){ persisted=true; }
  else if(crew){
    // joined before but this phone's copy is gone: wait for the crew's data instead of inventing a profile
    S={profiles:[{id:'p_wait', name:'Loading', color:P_COLORS[0], demo:true}], activeId:'p_wait', orders:{}, items:{}, wants:{}, reacts:{}, comments:{}, cats:{}}; crewSync=null;
  }
  else {
    S={profiles:[{id:'p_me', name:'Andrew', color:'#DD5A3E'}], activeId:'p_me', orders:{}, items:{}, wants:{}, reacts:{}, comments:{}, cats:{}};
    buildDemo(); persisted=false; // samples are shown, not saved, until you change something
  }
  ui.cmpA=S.activeId;
  if(!seenAt()) setSeen(Date.now());
  const seenV=lastSeenVersion();
  const showNews = loaded && (!seenV || vNum(seenV)<vNum(APP_VERSION));
  markVersionSeen();
  ensureS(); rebuildCats();
  if(crew) syncMode='crew';
  if(crew && loaded){ if(hasDemo()) stripDemo(); if(!S.profiles.length) S.profiles=[{id:'p_'+uid(), name:'Me', color:P_COLORS[0]}]; if(!profile(S.activeId)) S.activeId=S.profiles[0].id; }
  render();
  connectRemote();
  if(!IN_CLAUDE && 'serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  if(CREW_ON){
    if(crew){ startCrewLoop(); syncNow(); }
    else { let skip=false; try{ skip=!!localStorage.getItem('tummi_crew_skip'); }catch(_){}
      if(!skip){ ui.sheet={type:'crew', mode:'join', first:true}; renderSheet(); } }
  }
  if(showNews && !ui.sheet){ ui.sheet={type:'news', since: seenV || '1.3.0'}; renderSheet(); }
})();
</script>
